# iOS app: unsigned device IPA (no game content) plus a Simulator build, installed and launched
# in a booted Simulator; the app's startup record is checked and logs are kept as artifacts.
name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", "runtime/**", "tools/build/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: macos-15
    env:
      RLPORT_BUNDLE_ID: dev.rlport.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count
      - name: Build device IPA (unsigned)
        run: tools/build/ios/build_app.sh device
      - name: Check device binary
        run: |
          APP=out/ios/RLPort.app
          xcrun vtool -show-build "$APP/RLPort"
          xcrun otool -L "$APP/RLPort"
          plutil -p "$APP/Info.plist" | head -40
      - name: Build Simulator app
        run: tools/build/ios/build_app.sh simulator
      - name: Boot a Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          for rt in reversed(ios):
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          sys.exit("no iPhone simulator")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Install and launch
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl install "$UDID" out/ios/sim/RLPort.app
          xcrun simctl launch "$UDID" "$RLPORT_BUNDLE_ID" || echo "::warning::launch request failed"
          DATA=$(xcrun simctl get_app_container "$UDID" "$RLPORT_BUNDLE_ID" data)
          for _ in $(seq 1 30); do [ -f "$DATA/Documents/logs/startup.json" ] && break; sleep 1; done
          mkdir -p out/sim-logs && cp -R "$DATA/Documents/." out/sim-logs/
          cat out/sim-logs/logs/startup.json
          cat out/sim-logs/logs/app.log
      - name: Diagnostics
        if: always()
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          mkdir -p out/sim-logs
          codesign -dvvv --entitlements - out/ios/sim/RLPort.app 2>&1 | tee out/sim-logs/codesign.txt || true
          xcrun vtool -show-build out/ios/sim/RLPort.app/RLPort | tee out/sim-logs/vtool.txt || true
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "RLPort" OR eventMessage CONTAINS[c] "rlport" OR eventMessage CONTAINS[c] "dev.rlport.app"' \
            > out/sim-logs/system.log 2>&1 || true
          tail -80 out/sim-logs/system.log
          cp ~/Library/Logs/DiagnosticReports/RLPort* out/sim-logs/ 2>/dev/null || true
          ls out/sim-logs
      - name: Check startup record
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open("out/sim-logs/logs/startup.json"))
          assert r["config_exists"], "port.toml defaults not written"
          assert r["jit_status"] == "not-debugged", r["jit_status"]
          assert "StikDebug" in r["jit_reason"], r["jit_reason"]
          assert r["simulator_jit_probe"] == 42, f"split-mapping probe returned {r['simulator_jit_probe']}"
          print("startup record OK:", r)
          PY
          grep -q '^render_scale = 0.67$' out/sim-logs/config/port.toml
      - uses: actions/upload-artifact@v4
        with:
          name: RLPortRuntime-ipa
          path: out/ios/RLPortRuntime.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-logs
          path: out/sim-logs/
          retention-days: 7
