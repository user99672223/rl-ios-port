# DXMT BC1-BC7 emulation on Metal devices without BC support (patches/dxmt/01xx).
# Toolchain recipe is DXMT's own: external/dxmt/.github/workflows/ci.yml (x86_64 cross build:
# Wine v8.16-3shain, llvm-mingw, LLVM 15.0.7 built for Darwin x86_64, meson 1.10.0).
name: dxmt-bc

on:
  push:
    branches: [wip/dxmt-bc]
  workflow_dispatch:

env:
  LLVM_VERSION: llvmorg-15.0.7
  WINE_VERSION: v8.16-3shain
  WINE_URL: https://github.com/3Shain/wine/releases/download/v8.16-3shain/wine.tar.gz
  LLVM_MINGW_VERSION: "20251216"
  LLVM_MINGW_DIR: llvm-mingw-20251216-ucrt-macos-universal

jobs:
  setup-wine:
    runs-on: macos-15
    steps:
      - name: Cache Wine
        id: cache
        uses: actions/cache@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine
      - name: Install Wine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/wine
          curl -fSL ${{ env.WINE_URL }} > ./wine.tar.gz
          tar -zxf ./wine.tar.gz -C ./toolchains/wine
          rm ./wine.tar.gz
      - name: Layout
        run: ls ./toolchains/wine ./toolchains/wine/bin ./toolchains/wine/lib/wine | head -60

  setup-llvm-mingw:
    runs-on: macos-15
    steps:
      - name: Cache LLVM-MinGW
        id: cache
        uses: actions/cache@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}
      - name: Install LLVM-MinGW
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fSL https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_VERSION }}/${{ env.LLVM_MINGW_DIR }}.tar.xz > ./llvm.tar.xz
          mkdir -p ./toolchains
          tar -xf ./llvm.tar.xz -C ./toolchains
          rm ./llvm.tar.xz

  # LLVM 15 libraries for Darwin x86_64 (airconv links them into winemetal.so). Slow; cached.
  # The job-level concurrency group makes a second run wait instead of building it twice.
  setup-llvm-darwin:
    runs-on: macos-15
    concurrency:
      group: dxmt-bc-llvm-darwin
      cancel-in-progress: false
    steps:
      - name: Cache LLVM Darwin Build
        id: cache
        uses: actions/cache@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          path: ./toolchains/llvm-darwin
      - name: Clone LLVM Project
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project.git toolchains/llvm-project
      - name: Build LLVM for Darwin (x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/llvm-darwin-build
          cmake -B ./toolchains/llvm-darwin-build -S ./toolchains/llvm-project/llvm \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/toolchains/llvm-darwin" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DLLVM_HOST_TRIPLE=x86_64-apple-darwin \
            -DLLVM_ENABLE_ASSERTIONS=On \
            -DLLVM_ENABLE_ZSTD=Off \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_TOOLS=Off \
            -DBUG_REPORT_URL="https://github.com/3Shain/dxmt" \
            -DPACKAGE_VENDOR="DXMT" \
            -DLLVM_VERSION_PRINTER_SHOW_HOST_TARGET_INFO=Off \
            -G Ninja
          cmake --build ./toolchains/llvm-darwin-build
          cmake --install ./toolchains/llvm-darwin-build
      - name: Remove build tree
        if: steps.cache.outputs.cache-hit != 'true'
        run: rm -rf toolchains/llvm-darwin-build toolchains/llvm-project

  # What does a hosted macos-15 runner give us? (Metal device, BC support, Rosetta, Wine)
  probe:
    runs-on: macos-15
    steps:
      - name: System
        run: |
          uname -a; sw_vers; sysctl -n machdep.cpu.brand_string; sysctl hw.ncpu hw.memsize
          xcode-select -p
      - name: Metal device probe
        run: |
          cat > /tmp/probe.m <<'EOF'
          #import <Metal/Metal.h>
          #import <Foundation/Foundation.h>
          int main(void) {
            @autoreleasepool {
              for (id<MTLDevice> dev in MTLCopyAllDevices()) {
                printf("PROBE device %s unified=%d supportsBCTextureCompression=%d\n", dev.name.UTF8String, dev.hasUnifiedMemory, dev.supportsBCTextureCompression);
                printf("PROBE families apple1..9 =");
                for (int f = 1001; f <= 1009; f++) printf(" %d", [dev supportsFamily:(MTLGPUFamily)f]);
                printf(" mac2=%d metal3=%d argumentBuffers=%lu\n", [dev supportsFamily:MTLGPUFamilyMac2], [dev supportsFamily:MTLGPUFamilyMetal3], (unsigned long)dev.argumentBuffersSupport);
                MTLPixelFormat fmts[] = {MTLPixelFormatASTC_4x4_LDR, MTLPixelFormatASTC_6x6_LDR, MTLPixelFormatASTC_6x6_sRGB, MTLPixelFormatASTC_4x4_HDR, MTLPixelFormatBC7_RGBAUnorm};
                const char *names[] = {"ASTC_4x4_LDR", "ASTC_6x6_LDR", "ASTC_6x6_sRGB", "ASTC_4x4_HDR", "BC7"};
                for (int i = 0; i < 5; i++) {
                  MTLTextureDescriptor *td = [MTLTextureDescriptor texture2DDescriptorWithPixelFormat:fmts[i] width:64 height:64 mipmapped:NO];
                  printf("PROBE texture %s: %s\n", names[i], [dev newTextureWithDescriptor:td] ? "ok" : "FAILED");
                }
              }
            }
            return 0;
          }
          EOF
          clang -fobjc-arc -arch x86_64 -o /tmp/probe /tmp/probe.m -framework Metal -framework Foundation
          /tmp/probe

  build-and-test:
    runs-on: macos-15
    needs: [setup-wine, setup-llvm-mingw, setup-llvm-darwin]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Submodules (DXMT, bcdec, astc-encoder)
        run: |
          git submodule update --init --depth 1 external/dxmt external/bcdec external/astc-encoder
          git -C external/dxmt submodule update --init --depth 1 include/native/directx
      - name: Restore Wine
        uses: actions/cache/restore@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine
          fail-on-cache-miss: true
      - name: Restore LLVM-MinGW
        uses: actions/cache/restore@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}
          fail-on-cache-miss: true
      - name: Restore LLVM Darwin (x86_64)
        uses: actions/cache/restore@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          path: ./toolchains/llvm-darwin
          fail-on-cache-miss: true
      - name: Rosetta
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Select Xcode 16.1 (as DXMT's CI)
        run: sudo xcode-select -s /Applications/Xcode_16.1.app
      - name: Install Meson (as DXMT's CI)
        run: pip3 install meson==1.10.0 --break-system-packages
      - name: Apply patches/dxmt/* (0001 iOS port, 01xx BC emulation)
        run: tools/apply_patches.sh dxmt
      - name: Stage rltex (runtime/textures + bcdec) into DXMT's winemetal unix lib
        run: tests/d3d11/bc_textures/stage_rltex.sh "$PWD" "$PWD/external/dxmt"
      - name: Build DXMT (x86_64 cross build, as DXMT's CI clang-release job)
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchains/${{ env.LLVM_MINGW_DIR }}/bin"
          cd external/dxmt
          meson setup --cross-file build-win64.txt \
            -Dnative_llvm_path="$GITHUB_WORKSPACE/toolchains/llvm-darwin" \
            -Dwine_install_path="$GITHUB_WORKSPACE/toolchains/wine" \
            build --buildtype release --prefix "$GITHUB_WORKSPACE/dxmt-install" --strip
          meson compile -C build
          meson install -C build
          ls -R "$GITHUB_WORKSPACE/dxmt-install" | head -40
      - name: Build bc_textures.exe
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchains/${{ env.LLVM_MINGW_DIR }}/bin"
          make -C tests/d3d11/bc_textures CXX=x86_64-w64-mingw32-clang++ CXXFLAGS="-O1 -g0 -std=c++17 -Wall -Wextra -Wno-unused-parameter" LDFLAGS="-static"
          file tests/d3d11/bc_textures/bc_textures.exe
      - name: Build astcenc + rltex CLI (offline encoder inputs for the cache-hit run)
        run: |
          cmake -G Ninja -S external/astc-encoder -B build/astcenc -DCMAKE_BUILD_TYPE=Release -DASTCENC_ISA_NEON=ON -DASTCENC_CLI=ON -DASTCENC_WERROR=OFF
          cmake --build build/astcenc
          # rltex is built with -Werror and clang flags its encode worker as unused unless astc-encoder is linked in,
          # so link it (also what the on-device library will do); the CLI is what encode.py drives.
          cmake -G Ninja -S runtime/textures -B build/rltex -DCMAKE_BUILD_TYPE=Release -DRLTEX_BCDEC_DIR="$PWD/external/bcdec" \
            -DRLTEX_ASTCENC_INCLUDE="$PWD/external/astc-encoder/Source" -DRLTEX_ASTCENC_LIB="$PWD/build/astcenc/Source/libastcenc-neon-static.a"
          cmake --build build/rltex
          ls build/astcenc/Source/astcenc-neon build/rltex/rltex
      - name: Metal device (what DXMT will see)
        run: |
          cat > /tmp/probe.m <<'EOF'
          #import <Metal/Metal.h>
          int main(void) { for (id<MTLDevice> d in MTLCopyAllDevices()) printf("device %s bc=%d apple7=%d mac2=%d\n", d.name.UTF8String, d.supportsBCTextureCompression, [d supportsFamily:MTLGPUFamilyApple7], [d supportsFamily:MTLGPUFamilyMac2]); return 0; }
          EOF
          clang -fobjc-arc -o /tmp/probe /tmp/probe.m -framework Metal -framework Foundation && /tmp/probe
      - name: Run bc_textures.exe under Wine (native, forced no-BC, ASTC cache populate + hit)
        env:
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: |
          mkdir -p out
          tests/d3d11/bc_textures/run_ci.sh --wine "$GITHUB_WORKSPACE/toolchains/wine" --dxmt "$GITHUB_WORKSPACE/dxmt-install" \
            --exe "$GITHUB_WORKSPACE/tests/d3d11/bc_textures/bc_textures.exe" --out "$GITHUB_WORKSPACE/out" \
            --astcenc "$GITHUB_WORKSPACE/build/astcenc/Source/astcenc-neon" --rltex "$GITHUB_WORKSPACE/build/rltex/rltex"
      - name: Cache listing
        if: always()
        run: |
          mkdir -p out
          { ls -la out/bccache/cache/textures 2>/dev/null | head -80; echo; head -20 out/bccache/logs/texture_miss.log 2>/dev/null; } > out/bccache-listing.txt || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dxmt-bc-logs
          path: |
            out/summary.txt
            out/logs
            out/dxmt-logs
            out/bccache-listing.txt
            out/bccache/logs
      - name: Upload DXMT install
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dxmt-bc-install
          path: dxmt-install
